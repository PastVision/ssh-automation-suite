  # Ephemeral SSH client used by scripts/lab.py and the integration tests.
  # It shares the ssh-lab network, so hosts are reachable by name with no port
  # published to the Windows host. Started on demand via `run --rm` with the
  # `client` profile, never part of a normal `up`.
  lab-client:
    build:
      context: .
      dockerfile: Dockerfile
    image: ssh-lab/ssh-server:local
    container_name: ssh-lab-client
    profiles: ["client"]
    # Every invocation overrides this with `--entrypoint lab-ssh-client`.
    # /bin/true means a bare `compose run lab-client` exits immediately instead
    # of hanging or accidentally starting a second sshd.
    entrypoint: ["/bin/true"]
    environment:
      LAB_USER: tester
    volumes:
      # Private key is mounted read-only and only into this disposable client.
      - ./keys:/etc/lab/keys:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ssh-lab

networks:
  ssh-lab:
    name: ssh-lab-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

