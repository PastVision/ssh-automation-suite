# SSH Integration Test Lab — 20 independent OpenSSH servers.
#
# Isolation model
#   * Dedicated bridge network (ssh-lab-net, 172.28.0.0/16). Lab containers are
#     addressable by hostname inside the lab only.
#   * NO SSH port is published to the Windows host in this file. Every `ports`
#     key is intentionally absent: the lab is reached from a container on
#     ssh-lab-net (see scripts/lab.py), never through a host port. This is the
#     strictest reading of "do not expose SSH ports to the Windows host".
#     compose.loopback.yml is an opt-in override for the rare case where a host
#     port is genuinely required; even then it binds 127.0.0.1 only.
#   * Each service has its own writable layer, its own named host-key volume and
#     its own PID namespace (Docker default). No `privileged`, no host mounts of
#     application data.
#   * The only host file shared with containers is read-only and holds nothing
#     but the lab *public* key.
#
# This file is independent of backend/ and frontend/. It shares no network,
# volume or credential with the application.

name: ssh-lab

x-lab-host: &lab-host
  build:
    context: .
    dockerfile: Dockerfile
  image: ssh-lab/ssh-server:local
  restart: unless-stopped
  environment:
    LAB_USER: tester
    LAB_PUBKEY_PATH: /etc/lab/keys/id_lab.pub
  volumes:
    # Public key only. The private key never enters a container.
    - ./keys/id_lab.pub:/etc/lab/keys/id_lab.pub:ro
  # no-new-privileges is deliberately ABSENT for lab hosts. It blocks the setuid
  # bit that sudo needs ("The \"no new privileges\" flag is set, which prevents
  # sudo from running as root"), and Run-As is implemented with sudo. The
  # controls that remain are the capability allowlist right below: the container
  # can only ever do what these seven capabilities permit.
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETUID
    - SETGID
    - NET_BIND_SERVICE
    # sudo's password path writes an audit record. Without CAP_AUDIT_WRITE every
    # password-based `sudo -S` fails with "unable to send audit message:
    # Operation not permitted" regardless of the password being correct.
    - AUDIT_WRITE
    # sshd performs a chroot to /run/sshd for privilege separation. Without
    # CAP_SYS_CHROOT the daemon dies per connection with
    # 'chroot("/run/sshd"): Operation not permitted [preauth]', which the client
    # sees only as "Connection reset ... exit 255" before key exchange finishes.
    # This is the one capability sshd genuinely cannot run without.
    - SYS_CHROOT
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/22"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 5s
  networks:
    - ssh-lab

services:

  ssh-host-01:
    <<: *lab-host
    container_name: ssh-lab-ssh-host-01
    hostname: ssh-host-01
    environment:
      LAB_USER: tester
      LAB_HOSTNAME: ssh-host-01
      LAB_PUBKEY_PATH: /etc/lab/keys/id_lab.pub
    volumes:
      - ./keys/id_lab.pub:/etc/lab/keys/id_lab.pub:ro
      - host-01-keys:/etc/ssh/lab-host-keys

